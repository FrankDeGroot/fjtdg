name: Build and Deploy Web App fjtdg

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: ./app

      - name: Build app
        run: npm run build --if-present
        working-directory: ./app

      - name: Deploy to Azure Web App fjtdg
        uses: azure/webapps-deploy@v3
        with:
          app-name: fjtdg
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FJTDG }}
          package: ./app
