name: Build and Deploy Web App fjtdg

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: ./app

      - name: Build app
        run: npm run build
        working-directory: ./app

      - name: Assemble deploy package
        run: |
          mkdir -p deploy
          cp -r app/dist deploy/dist
          cp -r app/server deploy/server
          cp app/package.json deploy/package.json
          cp app/package-lock.json deploy/package-lock.json
          cd deploy
          npm ci --omit=dev

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App fjtdg
        uses: azure/webapps-deploy@v3
        with:
          app-name: fjtdg
          package: ./deploy
          startup-command: pm2 start /home/site/wwwroot/server/entry.fastify.js --name fjtdg --no-daemon

      - name: Verify app health
        shell: bash
        run: |
          HEALTH_URL="${{ vars.WEBAPP_HEALTH_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://fjtdg.azurewebsites.net/"
          fi

          echo "Checking health URL: $HEALTH_URL"

          for attempt in {1..12}; do
            http_code=$(curl -sS -L -o /tmp/health-response.txt -w "%{http_code}" "$HEALTH_URL" || true)

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
              echo "Health check passed with status $http_code"
              exit 0
            fi

            echo "Attempt $attempt/12 failed with status $http_code; retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after all retries. Last response body:"
          cat /tmp/health-response.txt || true
          exit 1
