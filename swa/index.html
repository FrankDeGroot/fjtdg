<!DOCTYPE html>
<html>

<head>
    <title>fjtdg</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>fjtdg</h1>
    <button onclick="callApi()">Call API</button>
    <button onclick="callBossApi()">Call Boss API</button>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
    <button onclick="getUser()">Who am I?</button>
    <input type="number" id="id" value="1">
    <pre id="output"></pre>
    <pre id="boss"></pre>
    <pre id="me"></pre>
    <script>
        async function callApi() {
            const res = await fetch('/api/hello');
            document.getElementById('output').textContent = await res.text();
        }
        async function callBossApi() {
            const id = document.getElementById('id').value;
            const res = await fetch(`/api/boss?id=${id}`);
            document.getElementById('boss').textContent = await res.text();
        }
        function login() {
            window.location.href = '/.auth/login/aad';
        }
        function logout() {
            window.location.href = '/.auth/logout';
        }
        async function getUser() {
            const res = await fetch('/.auth/me');
            const data = await res.json();
            document.getElementById('me').textContent = JSON.stringify(data);
        }
    </script>
</body>

</html>
